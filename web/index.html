<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>Jetstreamin Market Lister</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">JETSTREAMIN</div><div class="sub">MARKET LISTER</div><button id="settingsBtn" class="icon">⚙</button></header>
<main><section id="capture"><button id="newBtn" class="capture"><span>＋</span> NEW LISTING</button><div id="items" class="items"></div></section>
<section id="editor" hidden><div class="topbar"><button id="back">‹ Catalog</button><span id="state">DRAFT</span></div><div id="photo" class="photo"><button id="camera">📷 TAKE PHOTO</button></div><button id="analyze" class="ai">✦ ANALYZE WITH LOCAL AI</button>
<label>Title<input id="title" maxlength="80"></label><label>Description<textarea id="description" rows="5"></textarea></label><div class="grid"><label>Condition<input id="condition_text"></label><label>Category<input id="category"></label><label>Price<input id="price" type="number" min="0" step=".01"></label><label>Quantity<input id="quantity" type="number" min="1"></label></div><label>Shipping<input id="shipping"></label><button id="save" class="primary">SAVE LISTING</button>
<nav><button data-channel="ebay">eBay</button><button data-channel="whatnot">Whatnot</button><button data-channel="facebook">Facebook Auction</button></nav><pre id="output">Choose an export channel.</pre><button id="copy">COPY OUTPUT</button><div id="auction" hidden><div class="grid"><label>Start<input id="startPrice" type="number" value="3"></label><label>Increment<input id="increment" type="number" value="1"></label><label>Ends<input id="ends" type="datetime-local"></label></div><button id="createAuction">START BID LEDGER</button><div id="bidBox" hidden><div class="grid"><label>Bidder<input id="bidder"></label><label>Amount<input id="amount" type="number"></label></div><button id="addBid">ADD BID</button><div id="bids"></div></div></div></section></main>
<dialog id="settings"><form method="dialog"><h2>Local AI</h2><label>Ollama URL<input id="ollama"></label><label>Vision model<input id="model"></label><button id="saveSettings" value="close">SAVE</button></form></dialog><div id="toast"></div><script src="/app.js"></script></body></html>
